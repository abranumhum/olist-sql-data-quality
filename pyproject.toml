[project]
name = "olist-sql-data-quality"
version = "1.0.0"
description = "PostgreSQL data quality and analysis of the Olist e-commerce dataset"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a reachable PostgreSQL database",
]
